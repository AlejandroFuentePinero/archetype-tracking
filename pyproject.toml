[project]
name = "archetype-tracking"
version = "0.1.0"
description = "Tracks named Modern archetypes fortnightly across published MTGO and paper events"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro de la Fuente" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.scripts]
tracker = "tracker.cli:main"

[project.urls]
Homepage = "https://github.com/AlejandroFuentePinero/archetype-tracking"
Issues = "https://github.com/AlejandroFuentePinero/archetype-tracking/issues"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
